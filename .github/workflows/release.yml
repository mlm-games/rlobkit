name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/crate-publish.yml@main
    with:
      auto-bump: ${{ github.event_name == 'workflow_dispatch' }}
      workspace-publish: true
      prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.mark_prerelease }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
[package]
name = "rlobkit-app-events"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", optional = true }
jni-min-helper = { version = "0.4", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
] }
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
paranoid-android = { version = "0.2", default-features = false }

[package.metadata.android.cargo_rapk]
java_sources = "android"

[features]
default = []
jni-bridge = ["dep:jni", "dep:jni-min-helper"]
